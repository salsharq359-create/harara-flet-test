name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install "flet-cli>=1.1.2"
      - name: Build APK
        run: flet build apk --yes --arch arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: harara-test-apk
          path: build/apk/*.apk
          if-no-files-found: error

  # يدوي فقط (Actions > Build > Run workflow)
  ios-ipa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet-cli>=1.1.2"

      # التوقيع يفشل عندنا (ما فيه شهادة) وهذا متوقع، نكمل بعده بأنفسنا
      - name: Prepare Flutter project with Flet
        run: flet build ipa --yes || true

      - name: Build iOS app without code signing
        run: |
          FLUTTER=$(ls -d "$HOME"/flutter/*/bin/flutter | head -1)
          cd build/flutter
          "$FLUTTER" build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          APP=$(find build -path "*Release-iphoneos*" -type d -name "*.app" -prune -print | head -1)
          echo "Found: $APP"
          if [ -z "$APP" ]; then echo "app folder not found"; exit 1; fi
          rm -rf Payload harara-test.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry harara-test.ipa Payload
          ls -la harara-test.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: harara-test-ipa
          path: harara-test.ipa
          if-no-files-found: error
